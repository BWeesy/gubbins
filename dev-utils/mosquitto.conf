# Local development MQTT broker config for testing glowbridge.
#
# Deliberately permissive and local-only: listens on the loopback
# interface with anonymous access. This is fine for a dev machine and is
# NOT a production configuration — do not expose this broker to a network.
#
# Run it in the foreground (Ctrl+C to stop) with:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -v -c dev-utils\mosquitto.conf
#
# Then watch glowbridge traffic from another terminal:
#   & "C:\Program Files\mosquitto\mosquitto_sub.exe" -h localhost -t 'glow/#' -v

listener 1883 localhost
allow_anonymous true

# Keep everything in-process: no persistence file, log to stdout so the
# -v output above is all you need while developing.
persistence false
log_dest stdout
