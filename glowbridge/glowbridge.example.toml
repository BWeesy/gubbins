# glowbridge example configuration.
# Copy to ~/.config/glowbridge/glowbridge.toml and chmod 600 if credentials
# are stored inline. Every value shown is the default unless marked
# REQUIRED. Full reference: CONFIG.md.

[glowmarkt]
# Bright app credentials. REQUIRED here or via GLOWBRIDGE_GLOW_USERNAME /
# GLOWBRIDGE_GLOW_PASSWORD environment variables (env wins).
username = ""
password = ""

# Application ID presented to the Glowmarkt API. The default is the
# published Bright app ID; only change if Hildebrand rotate it.
#application_id = "b0f1b774-a586-4f72-9edd-27ead8aa7a8d"

# Optional pin. When set, discovery is skipped entirely and a pinned ID
# that does not exist is a fatal error. Leave unset to auto-discover.
#resources = ["1f31f05e-2cec-4cf8-b705-43294d6a7a96"]

[homeassistant]
# WebSocket URL of the Home Assistant instance. REQUIRED.
# Plain ws:// is correct over a trusted path (Tailscale, localhost); the
# link is already encrypted there. Use wss:// over an untrusted network.
url = "ws://homeassistant.local:8123/api/websocket"
# Long-lived access token (HA profile -> Security -> Long-lived access
# tokens). REQUIRED to import; prefer GLOWBRIDGE_HA_TOKEN over inline.
token = ""

[schedule]
# Seconds between poll cycles. Minimum 1800 (30 min): the DCC is half-hourly
# at best, so polling faster only adds load.
interval = 1800
# Maximum per-install schedule offset in seconds, derived deterministically
# from the machine ID. Spreads load across installs; 0 disables.
jitter = 300
# An hour is not imported until its end is this many seconds in the past,
# keeping the freshest, most-volatile hour out until it settles.
finalisation_lag = 5400
# Fresh-install backfill window: on first run each meter is backfilled this
# far (default 365 days) so a year of history lands on the Energy dashboard.
backfill_lookback = 31536000
# Trailing span re-fetched and re-imported every cycle, so DCC revisions and
# late gap-fills self-correct. Data older than this is never re-fetched, so
# a backfill arriving later than this is missed. Must be >= finalisation_lag.
revision_window = 604800
# How stale a meter must be (no new data for this long) before glowbridge
# nudges the DCC via the catchup endpoint. Default 1 day.
catchup_stale_after = 86400

[retry]
# In-cycle retry budget; when exhausted the cycle is skipped, not fatal.
max_attempts = 5
# Exponential backoff: base * 2^(attempt-1) seconds, capped, with jitter.
backoff_base = 60
backoff_max = 1800
# Minimum seconds between authentication attempts, enforced across
# restarts. Protects the Bright account from lockout.
auth_floor = 3600

[state]
# Directory for state.json (settled frontier, cumulative baseline, auth
# token) and status.json. Empty resolves to $STATE_DIRECTORY (systemd), then
# $XDG_STATE_HOME, then ~/.local/state/glowbridge.
dir = ""

[logging]
level = "info"              # debug, info, warning, error
format = "text"             # text or json
