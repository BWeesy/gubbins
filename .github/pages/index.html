<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gubbins</title>
<meta name="description" content="Small self-contained tools and toys, published from the gubbins repository." />
<style>
  :root{
    --bg:#0b1220; --panel:rgba(16,26,40,.82); --edge:rgba(120,150,180,.22);
    --ink:#e9f0f5; --muted:#8ea6b6; --cyan:#37d6c6;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);line-height:1.55;
    display:flex;align-items:center;justify-content:center;padding:32px 20px;
  }
  main{width:100%;max-width:640px}
  h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--cyan)}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 26px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a.card{
    display:block;padding:16px 18px;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--edge);border-radius:12px;transition:.14s;
  }
  a.card:hover,a.card:focus-visible{border-color:var(--cyan);background:rgba(55,214,198,.07)}
  a.card:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .name{font-size:16px;font-weight:600;margin:0 0 4px}
  .desc{margin:0;font-size:13.5px;color:var(--muted)}
  footer{margin-top:26px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--cyan)}
</style>
</head>
<body>
<main>
  <h1>gubbins</h1>
  <p class="sub">Small self-contained things, published straight from the repository.</p>

  <!-- One entry per directory copied into the site by .github/workflows/pages.yml. -->
  <ul>
    <li>
      <a class="card" href="on-the-angle/">
        <p class="name">On The Angle</p>
        <p class="desc">An interactive 3D model of field-hockey goalkeeper positioning: place the ball, move the keeper, and see how much of the goal is actually covered from the shooter's point of view.</p>
      </a>
    </li>
  </ul>

  <footer>Source on <a href="https://github.com/BWeesy/gubbins">GitHub</a>.</footer>
</main>
</body>
</html>
