name: glowbridge bug report
description: Report a problem with the glowbridge Glowmarkt/DCC to MQTT bridge
labels: ["bug", "glowbridge"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: **most "missing data" reports are the DCC pipeline, not
        the bridge.** The [Troubleshooting
        section](https://github.com/BWeesy/gubbins/blob/main/glowbridge/README.md#troubleshooting)
        shows how to tell the difference in about a minute. If `last_success` is recent but
        `data_complete_to` is hours behind, the bridge is working and the DCC is
        behind — and nothing downstream can conjure data the DCC has not sent.

        **Debug logs are safe to paste.** All output passes a redacting
        formatter: your Bright password, MQTT password and API token are
        replaced with `***`, including at debug level.

  - type: dropdown
    id: bright-app
    attributes:
      label: Is the same data missing in the Bright app?
      description: >-
        The single most useful piece of triage. If Bright is also missing it,
        the DCC has not delivered it and glowbridge cannot invent it.
      options:
        - "Not applicable — this is not a missing-data problem"
        - "No — Bright shows the data, glowbridge does not"
        - "Yes — Bright is missing it too"
        - "I have not checked yet"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: glowbridge version
      description: "Output of: uv run --script glowbridge.py --version"
      placeholder: glowbridge 0.1.0
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Debug output
      description: >-
        Output of `uv run --script glowbridge.py --once --debug`. This is
        redacted and safe to paste.
      render: text
    validations:
      required: true

  - type: textarea
    id: mqtt-status
    attributes:
      label: Retained MQTT status topics
      description: >-
        Run `mosquitto_sub -v -t 'glow/#'` (Ctrl+C after a few seconds) and
        paste the lines for these retained topics — they carry the triage
        information:

          - `<prefix>/bridge/availability` — online / offline (Last Will)
          - `<prefix>/bridge/status` — bridge-level JSON summary
          - `<prefix>/<resource_id>/status` — per-meter JSON: `data_complete_to`,
            `last_success`, `next_planned_update`, `consecutive_failures`

        `<prefix>` is your `mqtt.topic_prefix` (default `glow`). The
        `<prefix>/<resource_id>/state` topic is **not** retained, so it will not
        appear here — that is expected, not the problem.
      render: text
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - systemd service
        - NixOS
        - Manually / foreground
        - Container
        - Other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Debian 12, Python 3.12.4"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have read the Troubleshooting section of the glowbridge README
          required: true
        - label: >-
            I have checked that no credentials appear in the output I am pasting
          required: true
