name: glowbridge bug report
description: Report a problem with glowbridge (Glowmarkt/DCC to Home Assistant statistics importer)
labels: ["bug", "glowbridge"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: **most "missing data" reports are the DCC pipeline, not
        the bridge.** The [Troubleshooting
        section](https://github.com/BWeesy/gubbins/blob/main/glowbridge/README.md#troubleshooting)
        shows how to tell the difference in about a minute. If `last_success` is recent but
        `data_complete_to` is hours behind, the bridge is working and the DCC is
        behind — and nothing downstream can conjure data the DCC has not sent.

        **Debug output and `status.json` are safe to paste.** All log output
        passes a redacting formatter (Bright password and HA token replaced
        with `***`, even at debug level), and `status.json` holds no secrets.
        **Do not paste `state.json`** — it contains your Glow auth token.

  - type: dropdown
    id: bright-app
    attributes:
      label: Is the same data missing in the Bright app?
      description: >-
        The single most useful piece of triage. If Bright is also missing it,
        the DCC has not delivered it and glowbridge cannot invent it.
      options:
        - "Not applicable — this is not a missing-data problem"
        - "No — Bright shows the data, glowbridge does not"
        - "Yes — Bright is missing it too"
        - "I have not checked yet"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: glowbridge version
      description: "Output of: uv run --script glowbridge.py --version"
      placeholder: glowbridge 1.0.0
    validations:
      required: true

  - type: textarea
    id: debug-log
    attributes:
      label: Debug output
      description: >-
        Output of `uv run --script glowbridge.py --once --debug`. This is
        redacted and safe to paste.
      render: text
    validations:
      required: true

  - type: textarea
    id: status-file
    attributes:
      label: status.json
      description: >-
        Paste `status.json` from the state directory (next to `state.json`;
        default `~/.local/state/glowbridge/` or `$STATE_DIRECTORY` under
        systemd). It carries the triage information — `last_success`,
        `consecutive_failures`, `last_error`, and per-meter `data_complete_to`
        — and holds no secrets. Do NOT paste `state.json`, which contains the
        auth token.
      render: json
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - systemd service
        - NixOS
        - Manually / foreground
        - Container
        - Other
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: OS and Python version
      placeholder: "Debian 12, Python 3.12.4"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have read the Troubleshooting section of the glowbridge README
          required: true
        - label: >-
            I have checked that no credentials appear in the output I am pasting
          required: true
