<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sound Lab — short game sound effects</title>
<meta name="description" content="Design short game sound effects in the browser and export them as WAV files. Everything is synthesised, so the results are yours to use anywhere." />
<style>
  :root{
    --bg:#0b1220; --panel:rgba(16,26,40,.82); --edge:rgba(120,150,180,.22);
    --ink:#e9f0f5; --muted:#8ea6b6; --cyan:#37d6c6; --cyanDim:#1c6f68;
    --green:#5be08a; --red:#ff6b6b; --amber:#ffcf5c;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45}
  main{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--cyan)}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 18px;max-width:720px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  button,.filebtn{
    font-family:var(--sans);font-size:13px;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--edge);border-radius:8px;padding:8px 12px;cursor:pointer;transition:.12s;
  }
  button:hover,.filebtn:hover{background:rgba(255,255,255,.11)}
  button:focus-visible,.filebtn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
  button.primary{background:var(--cyanDim);border-color:var(--cyan);color:#eafffb}
  .filebtn input{position:absolute;width:1px;height:1px;opacity:0}
  .filebtn{position:relative;display:inline-block}
  .status{font-size:12.5px;color:var(--muted);min-height:18px;margin:-8px 0 14px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--edge);border-radius:12px;padding:14px;min-width:0}
  .head{display:flex;align-items:center;gap:10px}
  .badge{font-family:var(--mono);font-size:15px;font-weight:600;min-width:46px;text-align:center;
         border:1px solid var(--edge);border-radius:8px;padding:5px 6px}
  .badge.minus{color:var(--red)} .badge.plus{color:var(--green)}
  .name{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:6px;
        color:var(--ink);font:600 15px var(--sans);padding:4px 6px}
  .name:hover{border-color:var(--edge)} .name:focus{outline:none;border-color:var(--cyan)}
  .play{width:44px;height:36px;padding:0;font-size:16px}
  canvas.wave{display:block;width:100%;height:64px;margin:12px 0 8px;background:rgba(0,0,0,.22);
              border:1px solid var(--edge);border-radius:8px;cursor:pointer}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .meta code{font-family:var(--mono);color:var(--ink)}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .actions button{font-size:12px;padding:6px 9px}
  details{margin-top:10px;border-top:1px solid var(--edge);padding-top:8px}
  summary{cursor:pointer;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  summary:hover{color:var(--cyan)}
  .group{margin-top:10px}
  .glabel{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:4px}
  .row{display:grid;grid-template-columns:104px 1fr 64px;align-items:center;gap:8px;margin:3px 0}
  .row label{font-size:12px}
  .row .val{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right}
  input[type=range]{width:100%;accent-color:var(--cyan);height:20px;margin:0}
  .seg{display:flex;gap:4px}
  .seg button{flex:1;font-size:11.5px;padding:4px 6px}
  .seg button.on{background:var(--cyanDim);border-color:var(--cyan);color:#eafffb}
  .chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--cyan)}
  .grid.ko{margin-top:14px}
  .note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
  footer{margin-top:28px;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--muted)} footer a:hover{color:var(--cyan)}
  @media (max-width:420px){ .grid{grid-template-columns:1fr} .row{grid-template-columns:92px 1fr 58px} }
</style>
</head>
<body>
<main>
  <h1>Sound Lab</h1>
  <p class="sub">Design short game sound effects and download them as WAV files. Every sound is synthesised from the
    settings below, so there is nothing to license: use the results anywhere. Tap a waveform or press 1–9 and 0 to play,
    or K for the knockout.</p>

  <div class="toolbar">
    <button class="primary" id="playAll">Play all</button>
    <button id="downloadAll">Download all WAVs</button>
    <button id="exportJson">Export settings</button>
    <label class="filebtn">Import settings<input type="file" id="importJson" accept="application/json,.json" /></label>
    <button id="share">Copy share link</button>
    <button id="resetAll">Reset all</button>
    <label class="chk"><input type="checkbox" id="autoplay" checked /> Play when a slider is released</label>
  </div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="grid" id="grid"></div>
  <div class="grid ko" id="knockout"></div>

  <footer>Part of <a href="../">gubbins</a> · Source on <a href="https://github.com/BWeesy/gubbins/tree/main/sound-lab">GitHub</a></footer>
</main>

<script>
'use strict';

// ---------- Synth ----------
// Every sound is the same small synth with different settings: a tone (with pitch sweep,
// wobble, bell overtones and detuned voices), a sub-bass sweep, and filtered noise, all
// under one envelope. Rendering is done sample by sample in plain JS (not Web Audio nodes),
// with seeded noise, so what you hear and what you download are the same samples.

const EXPORT_RATE = 44100;

const DEFAULTS = {
  length: 200, attack: 2, curve: 2.5, gain: 0.8, seed: 1,
  toneLevel: 1, wave: 'sine', f0: 880, f1: 880, vibRate: 0, vibDepth: 0, bell: 0, unison: 1, detune: 0,
  subLevel: 0, subF0: 120, subF1: 50, subDecay: 1,
  noiseLevel: 0, cut0: 4000, cut1: 300, noiseDecay: 1,
};

// File names are Android-resource-safe (lowercase, underscores, starts with a letter).
const PRESETS = [
  { id: 'minus1',  badge: '−1',  name: 'Light ping', file: 'sfx_minus_1',
    p: { length: 160, attack: 1, curve: 3, gain: 0.7, wave: 'sine', f0: 1568, f1: 1480, bell: 0.35 } },
  { id: 'minus5',  badge: '−5',  name: 'Heavy thud', file: 'sfx_minus_5',
    p: { length: 230, attack: 1, curve: 2.4, gain: 0.95, toneLevel: 0.25, wave: 'triangle', f0: 220, f1: 80,
         subLevel: 1, subF0: 140, subF1: 42, subDecay: 1, noiseLevel: 0.45, cut0: 3500, cut1: 180, noiseDecay: 4 } },
  { id: 'minus10', badge: '−10', name: 'Explosion', file: 'sfx_minus_10',
    p: { length: 620, attack: 2, curve: 1.8, gain: 1, toneLevel: 0, seed: 7,
         subLevel: 0.85, subF0: 95, subF1: 28, subDecay: 1.4, noiseLevel: 1, cut0: 6000, cut1: 140, noiseDecay: 1 } },
  { id: 'plus1',   badge: '+1',  name: 'Healthy ding', file: 'sfx_plus_1',
    p: { length: 240, attack: 1, curve: 2.2, gain: 0.7, wave: 'sine', f0: 1047, f1: 1047, bell: 0.7 } },
  { id: 'plus5',   badge: '+5',  name: 'Woing', file: 'sfx_plus_5',
    p: { length: 330, attack: 8, curve: 1.4, gain: 0.8, wave: 'triangle', f0: 200, f1: 700, vibRate: 16, vibDepth: 0.9 } },
  { id: 'plus10',  badge: '+10', name: 'Full-on wooom', file: 'sfx_plus_10',
    p: { length: 540, attack: 70, curve: 1.6, gain: 0.9, wave: 'saw', f0: 110, f1: 880, vibRate: 6, vibDepth: 0.2,
         unison: 3, detune: 18, subLevel: 0.4, subF0: 55, subF1: 110, subDecay: 1,
         noiseLevel: 0.12, cut0: 700, cut1: 5000, noiseDecay: 0.8 } },
  // A new game: a long, rising engine "vrooooom".
  { id: 'gameStart', badge: '▶', name: 'Vrooooom', file: 'sfx_game_start',
    p: { length: 1400, attack: 260, curve: 0.8, gain: 0.9, wave: 'saw', f0: 55, f1: 520, vibRate: 5, vibDepth: 0.15,
         unison: 3, detune: 22, subLevel: 0.55, subF0: 40, subF1: 95, subDecay: 0.8,
         noiseLevel: 0.18, cut0: 400, cut1: 4000, noiseDecay: 0.6 } },
  // The layers of a knockout (a player falling to zero), mixed together below in "Knockout".
  { id: 'koCrash', badge: 'KO', name: 'Crash', file: 'sfx_ko_crash',
    p: { length: 700, attack: 1, curve: 2.2, gain: 0.9, toneLevel: 0, seed: 13,
         subLevel: 0.2, subF0: 80, subF1: 40, subDecay: 1.5, noiseLevel: 1, cut0: 9000, cut1: 1200, noiseDecay: 1.2 } },
  { id: 'koThud', badge: 'KO', name: 'Thud', file: 'sfx_ko_thud',
    p: { length: 320, attack: 1, curve: 2.6, gain: 1, toneLevel: 0.35, wave: 'triangle', f0: 160, f1: 50,
         subLevel: 1, subF0: 110, subF1: 35, subDecay: 1.1, noiseLevel: 0.35, cut0: 2500, cut1: 150, noiseDecay: 4 } },
  { id: 'koBoom', badge: 'KO', name: 'Explosion', file: 'sfx_ko_boom',
    p: { length: 1300, attack: 3, curve: 1.5, gain: 1, toneLevel: 0, seed: 21,
         subLevel: 0.9, subF0: 80, subF1: 24, subDecay: 1.2, noiseLevel: 1, cut0: 5000, cut1: 90, noiseDecay: 0.9 } },
  { id: 'koPing', badge: 'KO', name: 'Laser ping', file: 'sfx_ko_ping',
    p: { length: 140, attack: 1, curve: 2.5, gain: 0.6, wave: 'square', f0: 2400, f1: 700 } },
];

// ---------- Knockout mix ----------
// A knockout plays the crash, thud and explosion together, each at its own offset and level, with laser
// pings scattered across them. The pings are random: when each starts, its pitch, and where it sits left
// to right. The app makes a fresh roll every time a player is knocked out, so no two sound the same;
// here, "Re-roll pings" hears another one. Times are in ms from the knockout; pitch spread is ± semitones.
const KO_DEFAULTS = {
  crashAt: 0, crashGain: 0.8, thudAt: 30, thudGain: 1, boomAt: 90, boomGain: 0.9,
  pings: 7, pingFrom: 40, pingTo: 1100, pingSpread: 7, pingGain: 0.45, pingPan: 0.8, seed: 3,
  // Scales every layer. The phone adds the layers up as they play, with nothing to turn the total down, so
  // this keeps the loudest moment under full scale (the card shows the peak, and warns if it would clip).
  volume: 0.42,
};
const KO_LAYERS = [['koCrash', 'crashAt', 'crashGain'], ['koThud', 'thudAt', 'thudGain'], ['koBoom', 'boomAt', 'boomGain']];

// What plays when, as the app does it: [{ id, at (ms), gain, rate (playback speed, so pitch), pan (−1..1) }].
function planKnockout(mix, rand) {
  const m = { ...KO_DEFAULTS, ...mix };
  const cues = KO_LAYERS.map(([id, at, gain]) => ({ id, at: m[at], gain: m[gain] * m.volume, rate: 1, pan: 0 }));
  for (let i = 0; i < Math.round(m.pings); i++) {
    cues.push({
      id: 'koPing',
      at: m.pingFrom + rand() * Math.max(0, m.pingTo - m.pingFrom),
      gain: m.pingGain * m.volume,
      rate: Math.pow(2, (rand() * 2 - 1) * m.pingSpread / 12),
      pan: (rand() * 2 - 1) * m.pingPan,
    });
  }
  return cues;
}

// Equal-power panning that leaves a centred sound at full level in both ears, as SoundPool's volumes do.
const panGains = pan => {
  const th = (pan + 1) * Math.PI / 4;
  return [Math.min(1, Math.SQRT2 * Math.cos(th)), Math.min(1, Math.SQRT2 * Math.sin(th))];
};

// The knockout as stereo samples, for listening here: each layer rendered, sped up or slowed down by its
// rate (which is how the app changes a ping's pitch), and added in at its offset. Nothing is normalised:
// the phone just adds the layers up, so this does too, and clips anything past full scale the same way.
function renderKnockout(mix, sr) {
  const cues = planKnockout(mix, mulberry32(({ ...KO_DEFAULTS, ...mix }).seed * 2654435761));
  const layers = {};
  for (const c of cues) if (!layers[c.id]) layers[c.id] = render(sounds.find(s => s.id === c.id).p, sr);
  const n = Math.ceil(Math.max(...cues.map(c => c.at / 1000 * sr + layers[c.id].length / c.rate))) + 1;
  const L = new Float32Array(n), R = new Float32Array(n);
  for (const c of cues) {
    const src = layers[c.id], start = Math.round(c.at / 1000 * sr), [gl, gr] = panGains(c.pan);
    for (let i = 0; start + i < n; i++) {
      const x = i * c.rate, j = Math.floor(x);
      if (j + 1 >= src.length) break;
      const s = (src[j] + (src[j + 1] - src[j]) * (x - j)) * c.gain;
      L[start + i] += s * gl; R[start + i] += s * gr;
    }
  }
  let peak = 0;
  for (let i = 0; i < n; i++) {
    peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    L[i] = Math.max(-1, Math.min(1, L[i])); R[i] = Math.max(-1, Math.min(1, R[i]));
  }
  return [L, R, peak];
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const TAU = Math.PI * 2;
const WAVES = {
  sine: ph => Math.sin(TAU * ph),
  triangle: ph => 4 * Math.abs(ph - 0.5) - 1,
  square: ph => Math.tanh(3 * Math.sin(TAU * ph)), // softened so it doesn't buzz harshly
  saw: ph => 2 * ph - 1,
};

function render(params, sr) {
  const p = { ...DEFAULTS, ...params };
  const n = Math.max(2, Math.round(p.length / 1000 * sr));
  const out = new Float32Array(n);
  const att = Math.max(1, p.attack / 1000 * sr);
  const voices = Math.max(1, Math.round(p.unison));
  const phase = new Float64Array(voices);
  const wave = WAVES[p.wave] || WAVES.sine;
  const rand = mulberry32(p.seed * 2654435761);
  let bell2 = 0, bell3 = 0, subPh = 0, lp1 = 0, lp2 = 0;

  for (let i = 0; i < n; i++) {
    const t = i / sr, prog = i / (n - 1);
    const env = i < att ? i / att : Math.pow(Math.max(0, 1 - (i - att) / (n - att)), p.curve);
    let s = 0;

    if (p.toneLevel > 0) {
      const vib = Math.pow(2, p.vibDepth / 12 * Math.sin(TAU * p.vibRate * t));
      const f = p.f0 * Math.pow(p.f1 / p.f0, prog) * vib;
      let tone = 0;
      for (let v = 0; v < voices; v++) {
        const cents = voices > 1 ? (v / (voices - 1) - 0.5) * 2 * p.detune : 0;
        phase[v] = (phase[v] + f * Math.pow(2, cents / 1200) / sr) % 1;
        tone += wave(phase[v]);
      }
      tone /= voices;
      if (p.bell > 0) { // inharmonic partials that die away faster: what makes a ding a ding
        bell2 = (bell2 + f * 2.76 / sr) % 1;
        bell3 = (bell3 + f * 5.40 / sr) % 1;
        tone += p.bell * (0.5 * Math.sin(TAU * bell2) * env + 0.25 * Math.sin(TAU * bell3) * env * env);
      }
      s += p.toneLevel * tone * env;
    }

    if (p.subLevel > 0) {
      subPh = (subPh + p.subF0 * Math.pow(p.subF1 / p.subF0, prog) / sr) % 1;
      s += p.subLevel * Math.sin(TAU * subPh) * Math.pow(env, p.subDecay);
    }

    if (p.noiseLevel > 0) {
      const fc = Math.min(sr * 0.45, p.cut0 * Math.pow(p.cut1 / p.cut0, prog));
      const a = 1 - Math.exp(-TAU * fc / sr);
      lp1 += a * ((rand() * 2 - 1) - lp1);
      lp2 += a * (lp1 - lp2);
      // A low cutoff passes less energy; make it up so the level slider means the same at any brightness.
      const makeUp = Math.min(6, Math.sqrt(sr / (TAU * fc)));
      s += p.noiseLevel * lp2 * makeUp * Math.pow(env, p.noiseDecay);
    }

    out[i] = s;
  }

  let peak = 0;
  for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(out[i]));
  const k = peak > 0 ? p.gain / peak : 0;
  const tail = Math.min(n, Math.round(0.004 * sr)); // a 4 ms fade so the end never clicks
  for (let i = 0; i < n; i++) {
    const fade = i >= n - tail ? (n - 1 - i) / tail : 1;
    out[i] = Math.tanh(out[i] * k * 1.1) / Math.tanh(1.1) * fade;
  }
  return out;
}

function wavBlob(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ---------- Playback ----------
let ctx = null;
function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function play(sound) {
  const ac = audio();
  const data = render(sound.p, ac.sampleRate);
  const buf = ac.createBuffer(1, data.length, ac.sampleRate);
  buf.getChannelData(0).set(data);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
}
function playKnockout() {
  const ac = audio();
  const [L, R] = renderKnockout(mix, ac.sampleRate);
  const buf = ac.createBuffer(2, L.length, ac.sampleRate);
  buf.getChannelData(0).set(L);
  buf.getChannelData(1).set(R);
  const src = ac.createBufferSource();
  src.buffer = buf;
  src.connect(ac.destination);
  src.start();
}

// ---------- Controls ----------
// [key, label, min, max, step, unit, log scale]
const GROUPS = [
  { name: 'Envelope', fields: [
    ['length', 'Length', 40, 1500, 10, 'ms'], ['attack', 'Attack', 0, 300, 1, 'ms'],
    ['curve', 'Decay curve', 0.3, 6, 0.1, ''], ['gain', 'Volume', 0.05, 1, 0.01, ''] ] },
  { name: 'Tone', wave: true, fields: [
    ['toneLevel', 'Level', 0, 1, 0.01, ''], ['f0', 'Start pitch', 30, 4000, 1, 'Hz', true],
    ['f1', 'End pitch', 30, 4000, 1, 'Hz', true], ['vibRate', 'Wobble speed', 0, 40, 0.5, 'Hz'],
    ['vibDepth', 'Wobble depth', 0, 4, 0.05, 'st'], ['bell', 'Bell', 0, 1, 0.01, ''],
    ['unison', 'Voices', 1, 4, 1, ''], ['detune', 'Voice spread', 0, 50, 1, 'ct'] ] },
  { name: 'Sub bass', fields: [
    ['subLevel', 'Level', 0, 1, 0.01, ''], ['subF0', 'Start pitch', 20, 300, 1, 'Hz', true],
    ['subF1', 'End pitch', 20, 300, 1, 'Hz', true], ['subDecay', 'Fade speed', 0.3, 4, 0.05, ''] ] },
  { name: 'Noise', fields: [
    ['noiseLevel', 'Level', 0, 1, 0.01, ''], ['cut0', 'Start brightness', 100, 12000, 1, 'Hz', true],
    ['cut1', 'End brightness', 100, 12000, 1, 'Hz', true], ['noiseDecay', 'Fade speed', 0.3, 6, 0.05, ''],
    ['seed', 'Variation', 1, 50, 1, ''] ] },
];

const LOG_STEPS = 1000;
const toSlider = (v, min, max, log) => log ? Math.round(LOG_STEPS * Math.log(v / min) / Math.log(max / min)) : v;
const fromSlider = (x, min, max, log, step) => {
  const v = log ? min * Math.pow(max / min, x / LOG_STEPS) : x;
  return Math.round(v / step) * step;
};
const fmt = (v, step, unit) => (step < 1 ? (+v).toFixed(step < 0.1 ? 2 : 1) : String(Math.round(v))) + (unit ? ' ' + unit : '');

let sounds = [];
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  kids.forEach(c => e.append(c));
  return e;
};

// Healing sounds and the game start are drawn green; damage and the knockout red.
const upbeat = sound => /^[+▶]/.test(sound.badge);

function drawWave(canvas, sound) {
  drawSamples(canvas, render(sound.p, 22050), upbeat(sound) ? '#5be08a' : '#ff6b6b');
}

function drawSamples(canvas, data, colour) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
  if (!w) return;
  canvas.width = w; canvas.height = h;
  const g = canvas.getContext('2d');
  g.clearRect(0, 0, w, h);
  g.fillStyle = colour;
  const per = data.length / w, mid = h / 2;
  for (let x = 0; x < w; x++) {
    let lo = 1, hi = -1;
    const a = Math.floor(x * per), b = Math.max(a + 1, Math.floor((x + 1) * per));
    for (let i = a; i < b && i < data.length; i++) { lo = Math.min(lo, data[i]); hi = Math.max(hi, data[i]); }
    g.fillRect(x, mid - hi * mid * 0.92, 1, Math.max(1, (hi - lo) * mid * 0.92));
  }
}

function buildCard(sound) {
  const canvas = el('canvas', { class: 'wave', role: 'button', 'aria-label': 'Play ' + sound.name, tabindex: '0' });
  const lengthMeta = el('span');
  const refresh = () => {
    drawWave(canvas, sound);
    lengthMeta.textContent = Math.round({ ...DEFAULTS, ...sound.p }.length) + ' ms';
    // The knockout is made of these, so it changes too.
    if (sound.id.startsWith('ko')) refreshKnockout();
    save();
  };
  canvas.addEventListener('click', () => play(sound));
  canvas.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); play(sound); } });

  const nameInput = el('input', { class: 'name', value: sound.name, 'aria-label': 'Sound name' });
  nameInput.addEventListener('input', () => { sound.name = nameInput.value; save(); });

  const controls = [];
  const details = el('details', {}, el('summary', {}, 'Shape'));
  for (const grp of GROUPS) {
    const box = el('div', { class: 'group' }, el('div', { class: 'glabel' }, grp.name));
    if (grp.wave) {
      const seg = el('div', { class: 'seg', role: 'group', 'aria-label': 'Waveform' });
      for (const w of Object.keys(WAVES)) {
        const b = el('button', { type: 'button' }, w);
        b.addEventListener('click', () => { sound.p.wave = w; sync(); refresh(); if (autoplay.checked) play(sound); });
        seg.append(b);
        controls.push(() => b.classList.toggle('on', ({ ...DEFAULTS, ...sound.p }.wave) === w));
      }
      box.append(seg);
    }
    for (const [key, label, min, max, step, unit, log] of grp.fields) {
      const id = sound.id + '-' + key;
      const input = el('input', { type: 'range', id, min: log ? 0 : min, max: log ? LOG_STEPS : max, step: log ? 1 : step });
      const val = el('span', { class: 'val' });
      input.addEventListener('input', () => {
        sound.p[key] = fromSlider(+input.value, min, max, log, step);
        val.textContent = fmt(sound.p[key], step, unit);
        refresh();
      });
      input.addEventListener('change', () => { if (autoplay.checked) play(sound); });
      controls.push(() => {
        const v = { ...DEFAULTS, ...sound.p }[key];
        input.value = toSlider(v, min, max, log);
        val.textContent = fmt(v, step, unit);
      });
      box.append(el('div', { class: 'row' }, el('label', { for: id }, label), input, val));
    }
    details.append(box);
  }
  const sync = () => controls.forEach(f => f());

  const preset = PRESETS.find(x => x.id === sound.id);
  const card = el('section', { class: 'card', 'aria-label': sound.name },
    el('div', { class: 'head' },
      el('span', { class: 'badge ' + (upbeat(sound) ? 'plus' : 'minus') }, sound.badge),
      nameInput,
      el('button', { class: 'play primary', 'aria-label': 'Play', title: 'Play', onclick: () => play(sound) }, '▶')),
    canvas,
    el('div', { class: 'meta' }, el('code', {}, sound.file + '.wav'), lengthMeta),
    el('div', { class: 'actions' },
      el('button', { onclick: () => download(sound) }, 'Download WAV'),
      el('button', { onclick: () => { sound.p.seed = 1 + Math.floor(Math.random() * 50); vary(sound); sync(); refresh(); play(sound); } }, 'Vary'),
      el('button', { onclick: () => { sound.p = { ...preset.p }; sound.name = preset.name; nameInput.value = sound.name; sync(); refresh(); } }, 'Reset')),
    details);
  sync();
  // Draw once the card is in the page and has a width.
  requestAnimationFrame(refresh);
  window.addEventListener('resize', () => drawWave(canvas, sound));
  return card;
}

// Nudge the numbers that change the character of a sound by up to ±15%, inside their slider limits.
function vary(sound) {
  for (const grp of GROUPS) for (const [key, , min, max, step] of grp.fields) {
    if (key === 'seed' || key === 'unison' || key === 'gain') continue;
    const v = { ...DEFAULTS, ...sound.p }[key];
    if (!v) continue;
    const nv = v * (1 + (Math.random() * 2 - 1) * 0.15);
    sound.p[key] = Math.min(max, Math.max(min, Math.round(nv / step) * step));
  }
}

function download(sound) {
  saveFile(wavBlob(render(sound.p, EXPORT_RATE), EXPORT_RATE), sound.file + '.wav');
}

function saveFile(blob, name) {
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// The mix's settings on their own, for the app's res/raw/ folder beside the four layers' WAVs.
const knockoutBlob = () => new Blob([JSON.stringify({ ...KO_DEFAULTS, ...mix }, null, 2)], { type: 'application/json' });

// [key, label, min, max, step, unit]
const KO_GROUPS = [
  { name: 'Layers', fields: [
    ['crashAt', 'Crash at', 0, 800, 5, 'ms'], ['crashGain', 'Crash level', 0, 1, 0.01, ''],
    ['thudAt', 'Thud at', 0, 800, 5, 'ms'], ['thudGain', 'Thud level', 0, 1, 0.01, ''],
    ['boomAt', 'Explosion at', 0, 800, 5, 'ms'], ['boomGain', 'Explosion level', 0, 1, 0.01, ''],
    ['volume', 'Overall volume', 0.05, 1, 0.01, ''] ] },
  { name: 'Laser pings', fields: [
    ['pings', 'How many', 0, 16, 1, ''], ['pingFrom', 'From', 0, 2000, 10, 'ms'], ['pingTo', 'To', 0, 2000, 10, 'ms'],
    ['pingSpread', 'Pitch spread', 0, 12, 0.5, 'st'], ['pingGain', 'Level', 0, 1, 0.01, ''],
    ['pingPan', 'Left–right spread', 0, 1, 0.01, ''], ['seed', 'Roll', 1, 999, 1, ''] ] },
];

let refreshKnockout = () => {};

function buildKnockout() {
  const canvas = el('canvas', { class: 'wave', role: 'button', 'aria-label': 'Play the knockout', tabindex: '0' });
  const lengthMeta = el('span');
  const controls = [];
  const sync = () => controls.forEach(f => f());
  refreshKnockout = () => {
    const [L, R, peak] = renderKnockout(mix, 22050);
    drawSamples(canvas, L.map((x, i) => (x + R[i]) / 2), '#ff6b6b');
    lengthMeta.textContent = Math.round(L.length / 22.05) + ' ms, peak ' + peak.toFixed(2) +
      (peak > 1 ? ': clips, so turn the overall volume down' : '');
  };
  const changed = () => { refreshKnockout(); save(); };
  canvas.addEventListener('click', playKnockout);
  canvas.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playKnockout(); } });

  const details = el('details', { open: '' }, el('summary', {}, 'Mix'));
  for (const grp of KO_GROUPS) {
    const box = el('div', { class: 'group' }, el('div', { class: 'glabel' }, grp.name));
    for (const [key, label, min, max, step, unit] of grp.fields) {
      const id = 'ko-' + key;
      const input = el('input', { type: 'range', id, min, max, step });
      const val = el('span', { class: 'val' });
      input.addEventListener('input', () => { mix[key] = +input.value; val.textContent = fmt(mix[key], step, unit); changed(); });
      input.addEventListener('change', () => { if (autoplay.checked) playKnockout(); });
      controls.push(() => { input.value = mix[key]; val.textContent = fmt(mix[key], step, unit); });
      box.append(el('div', { class: 'row' }, el('label', { for: id }, label), input, val));
    }
    details.append(box);
  }

  const card = el('section', { class: 'card', 'aria-label': 'Knockout' },
    el('div', { class: 'head' },
      el('span', { class: 'badge minus' }, 'KO'),
      el('span', { class: 'name' }, 'Knockout'),
      el('button', { class: 'play primary', 'aria-label': 'Play the knockout', title: 'Play', onclick: playKnockout }, '▶')),
    canvas,
    el('div', { class: 'meta' }, el('code', {}, 'sfx_knockout.json'), lengthMeta),
    el('p', { class: 'note' }, 'When a player falls to zero: the crash, thud and explosion above, with laser pings scattered ' +
      'across them. The app re-rolls the pings every time, so each knockout sounds a little different.'),
    el('div', { class: 'actions' },
      el('button', { onclick: () => { mix.seed = 1 + Math.floor(Math.random() * 999); sync(); changed(); playKnockout(); } }, 'Re-roll pings'),
      el('button', { onclick: () => saveFile(knockoutBlob(), 'sfx_knockout.json') }, 'Download mix settings'),
      el('button', { onclick: () => { mix = { ...KO_DEFAULTS }; sync(); changed(); } }, 'Reset')),
    details);
  sync();
  requestAnimationFrame(refreshKnockout);
  window.addEventListener('resize', refreshKnockout);
  return card;
}

// ---------- State: localStorage, share links, import/export ----------
// Settings from before the start and knockout sounds load fine: anything missing keeps its preset.
const STORE = 'sound-lab:v1';
const fresh = () => PRESETS.map(x => ({ id: x.id, badge: x.badge, name: x.name, file: x.file, p: { ...x.p } }));
const snapshot = () => ({
  version: 1,
  sounds: sounds.map(s => ({ id: s.id, name: s.name, file: s.file, p: s.p })),
  knockout: { ...KO_DEFAULTS, ...mix },
});

function adopt(data) {
  if (!data || !Array.isArray(data.sounds)) throw new Error('Not Sound Lab settings');
  const base = fresh();
  for (const s of base) {
    const got = data.sounds.find(x => x.id === s.id);
    if (got) { s.p = { ...got.p }; if (typeof got.name === 'string') s.name = got.name; }
  }
  return { sounds: base, mix: { ...KO_DEFAULTS, ...(data.knockout || {}) } };
}
function save() { try { localStorage.setItem(STORE, JSON.stringify(snapshot())); } catch (e) { /* private mode: fine */ } }
function load() {
  try {
    const m = location.hash.match(/^#s=([A-Za-z0-9_-]+)$/);
    if (m) return adopt(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/'))))));
  } catch (e) { say('That share link could not be read; showing your last settings instead.'); }
  try { const raw = localStorage.getItem(STORE); if (raw) return adopt(JSON.parse(raw)); } catch (e) { /* ignore */ }
  return { sounds: fresh(), mix: { ...KO_DEFAULTS } };
}
function use(state) { sounds = state.sounds; mix = state.mix; }

const status = document.getElementById('status');
let statusTimer;
function say(msg) { status.textContent = msg; clearTimeout(statusTimer); statusTimer = setTimeout(() => status.textContent = '', 5000); }

let mix = { ...KO_DEFAULTS };
const grid = document.getElementById('grid');
const knockout = document.getElementById('knockout');
const autoplay = document.getElementById('autoplay');
function renderAll() {
  grid.replaceChildren(...sounds.map(buildCard));
  knockout.replaceChildren(buildKnockout());
}

document.getElementById('playAll').addEventListener('click', () => {
  sounds.forEach((s, i) => setTimeout(() => play(s), i * 700));
  setTimeout(playKnockout, sounds.length * 700 + 400);
});
document.getElementById('downloadAll').addEventListener('click', () => {
  sounds.forEach((s, i) => setTimeout(() => download(s), i * 400));
  setTimeout(() => saveFile(knockoutBlob(), 'sfx_knockout.json'), sounds.length * 400);
  say('Downloading ' + sounds.length + ' WAV files and the knockout mix. Your browser may ask once to allow multiple downloads.');
});
document.getElementById('exportJson').addEventListener('click', () => {
  saveFile(new Blob([JSON.stringify(snapshot(), null, 2)], { type: 'application/json' }), 'sound-lab-settings.json');
});
document.getElementById('importJson').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { use(adopt(JSON.parse(await f.text()))); renderAll(); save(); say('Imported ' + f.name + '.'); }
  catch (err) { say('Could not import that file: ' + err.message); }
  e.target.value = '';
});
document.getElementById('share').addEventListener('click', async () => {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(snapshot())))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const url = location.href.split('#')[0] + '#s=' + code;
  history.replaceState(null, '', url);
  try { await navigator.clipboard.writeText(url); say('Share link copied. It carries every sound’s settings and the knockout mix.'); }
  catch (e) { say('Share link is in the address bar; copy it from there.'); }
});
document.getElementById('resetAll').addEventListener('click', () => {
  if (!confirm('Reset every sound and the knockout mix to their starting presets?')) return;
  use({ sounds: fresh(), mix: { ...KO_DEFAULTS } }); renderAll(); save(); history.replaceState(null, '', location.href.split('#')[0]);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'k' || e.key === 'K') { playKnockout(); return; }
  const i = '1234567890'.indexOf(e.key);
  if (i >= 0 && sounds[i]) play(sounds[i]);
});

use(load());
renderAll();
</script>
