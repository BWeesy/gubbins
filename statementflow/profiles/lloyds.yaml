# SPDX-License-Identifier: MIT
#
# Lloyds Bank CSV export profile. Column layout only.
#
# Export header (8 columns):
#   Transaction Date, Transaction Type, Sort Code, Account Number,
#   Transaction Description, Debit Amount, Credit Amount, Balance
#
# Layout notes:
#   * Separate Debit Amount / Credit Amount columns (positive magnitudes), not a
#     single signed column.
#   * Running Balance present -> dedup keys on it and the §5a reconciliation
#     check works.
#   * No transaction-id column; rows are newest-first.

name: lloyds
format: csv
encoding: utf-8
reverse: true

dedup_strategy: running_balance
payee_strategy: name_or_description

date_column: "Transaction Date"
date_format: "%d/%m/%Y"
debit_column: "Debit Amount"
credit_column: "Credit Amount"
balance_column: "Balance"
description_column: "Transaction Description"
category_hint_column: "Transaction Type"
